name: Day 2 - Env, Variables & Secrets

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  APP_NAME: "Portal-Infrastruktur"
  ENVIRONMENT: "Staging"

jobs:
  test-config:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Uji Environment Variables (Level Workflow & Step)
        env:
          STEP_NOTE: "Hanya muncul di step 1"
        run: |
          echo "Aplikasi: $APP_NAME"
          echo "Environment: $ENVIRONMENT"
          echo "Catatan Step: $STEP_NOTE"

      - name: 2. Uji Scope Variabel (Step 2)
        run: |
          echo "Aplikasi masih terbaca: $APP_NAME"
          echo "Catatan Step 1 harusnya kosong: [$STEP_NOTE]"

      - name: 3. Uji Repository Variables & Secrets
        env:
          # Praktik terbaik (Best Practice): masukkan secrets/vars ke env step dulu
          PORT_CONFIG: ${{ vars.TARGET_PORT }}
          PASS_CONFIG: ${{ secrets.SERVER_PASSWORD }}
        run: |
          echo "Target Port Server: $PORT_CONFIG"
          echo "Password Server: $PASS_CONFIG"
